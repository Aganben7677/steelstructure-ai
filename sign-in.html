<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Sign In - steelstructure.ai</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.signin-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  background: var(--bg-secondary);
}
.signin-box {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--card-shadow);
  text-align: center;
}
.signin-box h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-primary);
}
.signin-box p {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-bottom: 28px;
}
#clerk-sign-in {
  min-height: 300px;
}
.back-link {
  margin-top: 20px;
  font-size: 0.85rem;
  color: var(--accent);
  text-decoration: none;
}
.back-link:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<script async crossorigin="anonymous" 
  data-clerk-publishable-key="pk_test_Y29uY3JldGUtbGFiLTIuY2xlcmsuYWNjb3VudHMuZGV2JA"
  src="https://concrete-lab-2.clerk.accounts.dev/npm/clerk-js@latest/dist/clerk.browser.js" 
  type="text/javascript">
</script>

<div class="signin-page">
  <div class="signin-box">
    <h1>Welcome Back</h1>
    <p>Sign in to steelstructure.ai</p>
    <div id="clerk-sign-in"></div>
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>
</div>

<script>
window.addEventListener('load', async function() {
  if (typeof Clerk === 'undefined') {
    document.getElementById('clerk-sign-in').innerHTML = '<p style="color:var(--text-secondary)">Loading login...</p>';
    return;
  }
  
  try {
    await Clerk.load();
    
    const container = document.getElementById('clerk-sign-in');
    container.innerHTML = '';
    
    if (Clerk.user) {
      // Already signed in, redirect to home
      window.location.href = 'index.html';
      return;
    }
    
    // Mount the sign-in component
    Clerk.mountSignIn(container, {
      appearance: {
        variables: {
          colorPrimary: '#2563eb',
          colorBackground: 'var(--card-bg)',
          colorText: 'var(--text-primary)',
          colorInputBackground: 'var(--bg-secondary)',
          colorInputText: 'var(--text-primary)',
          borderRadius: '8px'
        }
      }
    });
  } catch (e) {
    console.error('Clerk error:', e);
    document.getElementById('clerk-sign-in').innerHTML = 
      '<p style="color:#ef4444">Login service temporarily unavailable. Please try again later.</p>';
  }
});
</script>

</body>
</html>
